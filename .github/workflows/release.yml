name: Build, Verify, and Release AppImage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      NO_STRIP: true
      WEBKIT_DISABLE_DMABUF_RENDERER: 1
    steps:
      - name: Install Arch Linux dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git curl wget file base-devel \
            webkit2gtk-4.1 gtk3 librsvg libayatana-appindicator \
            gobject-introspection gdk-pixbuf2 glib2 \
            xdotool xdg-utils desktop-file-utils patchelf dbus \
            openssl squashfs-tools fuse2 \
            nodejs npm rust github-cli \
            xorg-server-xvfb imagemagick mesa

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare updated Tauri linuxdeploy tools for Arch Linux (PR #16062)
        run: |
          for CACHE_DIR in "$HOME/.cache/tauri" "/root/.cache/tauri" "/github/home/.cache/tauri"; do
            mkdir -p "$CACHE_DIR"
            curl -fL "https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage" \
              -o "$CACHE_DIR/linuxdeploy-x86_64.AppImage"
            chmod +x "$CACHE_DIR/linuxdeploy-x86_64.AppImage"
            dd if=/dev/zero bs=1 count=3 seek=8 conv=notrunc of="$CACHE_DIR/linuxdeploy-x86_64.AppImage" || true

            curl -fL "https://raw.githubusercontent.com/tauri-apps/tauri/8e70283/crates/tauri-bundler/src/bundle/linux/appimage/linuxdeploy-plugin-gtk.sh" \
              -o "$CACHE_DIR/linuxdeploy-plugin-gtk.sh"
            # Guard PATCH_ARRAY directories in case gdk_pixbuf_moduledir does not exist on Arch (gdk-pixbuf 2.44+)
            sed -i 's/done < <(find "\$directory"/done < <([ -d "\$directory" ] \&\& find "\$directory"/' "$CACHE_DIR/linuxdeploy-plugin-gtk.sh"
            # Export WEBKIT_DISABLE_DMABUF_RENDERER=1 in AppRun GTK hook and fix rpath for WebKit helper processes
            cat >> "$CACHE_DIR/linuxdeploy-plugin-gtk.sh" << 'EOF'
          cat >> "$HOOKFILE" << 'HOOK_EOF'
          export WEBKIT_DISABLE_DMABUF_RENDERER="${WEBKIT_DISABLE_DMABUF_RENDERER:-1}"
          HOOK_EOF
          for wk_bin in "$APPDIR"/usr/lib*/webkit2gtk-4.1/WebKit*Process; do
            if [ -f "$wk_bin" ]; then
              patchelf --set-rpath '$ORIGIN:$ORIGIN/..:$ORIGIN/../..' "$wk_bin" || true
            fi
          done
          EOF
            chmod +x "$CACHE_DIR/linuxdeploy-plugin-gtk.sh"
          done

      - name: Install frontend dependencies and build AppImage
        run: |
          npm install
          npx tauri build --bundles appimage --verbose

      - name: Verify AppImage launches and renders UI (No Blank Grey Screen)
        run: |
          APPIMAGE_PATH=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n 1)
          echo "Testing AppImage: $APPIMAGE_PATH"
          chmod +x "$APPIMAGE_PATH"

          LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            dbus-run-session -- xvfb-run -a -s "-screen 0 1024x768x24" bash -c "
              \"$APPIMAGE_PATH\" > /tmp/cachydrive_run.log 2>&1 &
              APP_PID=\$!
              sleep 7
              if ! kill -0 \$APP_PID 2>/dev/null; then
                echo 'ERROR: CachyDrive process exited prematurely!'
                cat /tmp/cachydrive_run.log
                exit 1
              fi
              magick import -window root /tmp/ui_screenshot.png
              kill \$APP_PID 2>/dev/null || true
            "

          cat /tmp/cachydrive_run.log || true
          magick identify /tmp/ui_screenshot.png

          # Check that the screenshot contains multiple distinct UI colors (white card, purple logo/buttons, blue/red buttons)
          COLORS=$(magick /tmp/ui_screenshot.png -format "%k" info:)
          echo "Distinct rendered colors in window: $COLORS"
          if [ "$COLORS" -lt 15 ]; then
            echo "ERROR: Screenshot has too few colors ($COLORS) — window appears blank/grey!"
            exit 1
          fi
          echo "UI render verification passed successfully!"

      - name: Create Release and Upload Verified AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name || 'v0.2.0' }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target main \
              --title "CachyDrive $TAG - Selective Sync & Local Space Saver" \
              --notes "### ✨ What's New in $TAG
          - **Selective Sync (Visual Folder & File Tree):** Browse your local and Google Drive folder hierarchy from the *Selective Sync* (*Klasör Seçimi*) tab with instant lazy-loading, real-time search filtering, and status badges (*Local*, *Cloud Only*, *Local & Cloud*, *Excluded*).
          - **One-Click Cloud Scan:** Instantly loads local items and saved exclusion rules, with a **Scan Cloud** button to merge remote-only folders and files via \`rclone lsjson\`.
          - **Optional Local Space Saver:** Optionally delete unchecked/excluded folders and files from your local \`~/GoogleDrive\` directory (with confirmation dialog) to free up disk space while keeping them 100% safe on Google Drive.
          - **Linux / CachyOS WebKitGTK Rendering Fix:** Built natively on Arch Linux with \`WEBKIT_DISABLE_DMABUF_RENDERER=1\` to prevent DMA-BUF blank grey screen issues on Wayland/CachyOS."
          fi
          gh release upload "$TAG" src-tauri/target/release/bundle/appimage/*.AppImage --clobber
